<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to Jesus — Admin Console</title>
<style>
  :root {
    --bg: #12100e;
    --panel: #1c1917;
    --panel-2: #241f1b;
    --line: #332c26;
    --text: #f2ece5;
    --muted: #a1968a;
    --accent: #f0a04b;
    --accent-2: #c9639b;
    --ok: #4ec98a;
    --bad: #e5544b;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 14px; line-height: 1.5;
  }
  a { color: var(--accent); }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 11px; border-radius: 999px; font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .dot.live { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; gap: 16px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 16px; }
  .charts { grid-template-columns: 2fr 1fr; margin-bottom: 16px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px;
  }
  .card h2 { margin: 0 0 14px; font-size: 13px; font-weight: 600; color: var(--muted);
             text-transform: uppercase; letter-spacing: .7px; }
  .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .stat-value { font-size: 30px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .6px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: var(--panel-2); }
  .truncate { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab {
    padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #241a10; font-weight: 600; }
  button {
    font-family: inherit; font-size: 13px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); padding: 6px 12px; border-radius: 7px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #241a10; font-weight: 600; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  input, select {
    font-family: inherit; font-size: 13px; background: var(--bg);
    border: 1px solid var(--line); color: var(--text);
    padding: 7px 10px; border-radius: 7px; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); }
  .badge.ok { color: var(--ok); border-color: rgba(78,201,138,.4); }
  .badge.bad { color: var(--bad); border-color: rgba(229,84,75,.4); }
  .badge.muted { color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }
  #login {
    max-width: 380px; margin: 12vh auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 28px;
  }
  #login h1 { font-size: 19px; margin: 0 0 6px; }
  #login p { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  #login label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
  #login button { width: 100%; margin-top: 20px; padding: 10px; }
  .error { color: var(--bad); font-size: 13px; margin-top: 12px; min-height: 18px; }
  .hidden { display: none !important; }
  .empty { color: var(--muted); padding: 22px; text-align: center; font-size: 13px; }
  .flag-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .flag-row:last-child { border-bottom: none; }
  .flag-key { flex: 1; }
  .flag-key code { font-size: 13px; }
  .flag-key small { display: block; color: var(--muted); font-size: 11px; }
  .flag-control { width: 130px; }
  .demo-badge {
    background: rgba(240,160,75,.14); border-color: var(--accent); color: var(--accent);
    font-weight: 600; letter-spacing: .4px;
  }
  body.demo-on header { box-shadow: inset 0 -2px 0 var(--accent); }
  #demoBtn { width: 100%; margin-top: 10px; background: transparent; border-style: dashed; }
  #login .or {
    text-align: center; color: var(--muted); font-size: 11px;
    letter-spacing: .6px; margin: 16px 0 0; text-transform: uppercase;
  }
  #login .demo-hint { color: var(--muted); font-size: 11px; text-align: center; margin: 8px 0 0; }
</style>
</head>
<body>

<!-- ------------------------------------------------------------------ login -->
<div id="login">
  <h1>Talk to Jesus</h1>
  <p>Admin console</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="admin@example.com">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
  <button class="primary" id="loginBtn">Sign in</button>
  <div class="error" id="loginError"></div>
  <p class="or">or</p>
  <button id="demoBtn">View demo dashboard</button>
  <p class="demo-hint">Sample data only — no backend, no database, nothing is saved.</p>
</div>

<!-- ------------------------------------------------------------- dashboard -->
<div id="app" class="hidden">
  <header>
    <h1>Talk to Jesus <span class="muted">— Admin Console</span></h1>
    <span class="pill"><span class="dot live" id="liveDot"></span><span id="liveLabel">Live</span></span>
    <span class="pill" id="healthPill">—</span>
    <div class="spacer"></div>
    <span class="pill demo-badge hidden" id="demoBadge">DEMO DATA</span>
    <span class="pill" id="whoami">—</span>
    <button id="refreshBtn">Refresh</button>
    <button id="exitDemoBtn" class="hidden">Exit demo</button>
    <button id="logoutBtn">Sign out</button>
  </header>

  <main>
    <section class="grid cards" id="cards"></section>

    <section class="grid charts">
      <div class="card">
        <h2>Conversations per day</h2>
        <div id="timeseries"></div>
      </div>
      <div class="card">
        <h2>Language split</h2>
        <div id="languages"></div>
      </div>
    </section>

    <section class="card" style="margin-bottom:16px">
      <h2>Pipeline latency — where the seconds go</h2>
      <div id="latency"></div>
    </section>

    <section class="card">
      <div class="tabs" id="tabs">
        <div class="tab active" data-tab="users">Users</div>
        <div class="tab" data-tab="songs">Songs</div>
        <div class="tab" data-tab="conversations">Conversations</div>
        <div class="tab" data-tab="webhooks">Webhooks</div>
        <div class="tab" data-tab="flags">Feature flags</div>
        <div class="tab" data-tab="audit">Audit log</div>
      </div>
      <div id="tabContent"></div>
    </section>
  </main>
</div>

  function esc(value) {
    if (value === null || value === undefined) return '';
    return String(value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmt(n) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('en-IN');
  }

  function ms(v) { return v === null || v === undefined ? '—' : fmt(Math.round(v)) + ' ms'; }

  function ago(iso) {
    if (!iso) return '—';
    var diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return Math.max(0, Math.round(diff)) + 's ago';
    if (diff < 3600) return Math.round(diff / 60) + 'm ago';
    if (diff < 86400) return Math.round(diff / 3600) + 'h ago';
    return Math.round(diff / 86400) + 'd ago';
  }

  // -------------------------------------------------------------- demo mode
  // A fully hardcoded dataset so the console can be shown off without a
  // backend, a database or a network. Every endpoint the panel calls has a
  // mock below, and writes mutate the in-memory copy so the buttons still
  // "work" on stage. Nothing here ever touches the real API.

  var DEMO_USER = { id: 'demo-admin', email: 'demo@talktojesus.app', is_admin: true };
  var demoState = null;

  function isoAgo(minutes) {
    return new Date(Date.now() - minutes * 60000).toISOString();
  }

  // Stable pseudo-random in [0,1) so the same demo looks the same every run.
  function seeded(i) {
    var x = Math.sin((i + 1) * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  function buildDemoState() {
    var series = [];
    for (var d = 29; d >= 0; d--) {
      var day = new Date(Date.now() - d * 86400000);
      var weekend = (day.getDay() === 0 || day.getDay() === 6) ? 1.3 : 1;
      var growth = 260 + (29 - d) * 12;
      series.push({
        date: day.toISOString().slice(0, 10),
        conversations: Math.round(growth * weekend * (0.85 + seeded(d) * 0.3)),
        users: Math.round(9 + seeded(d + 40) * 22)
      });
    }

  function demoAudit(action, target, meta) {
    demoState.audit.unshift({
      id: 'a_' + (400 + demoState.audit.length),

  // Nudges the numbers on every poll so the "Live" dot is telling the truth.
  function demoDrift() {
    demoState.tick++;
    var bump = 1 + (demoState.tick % 3);
    demoState.overview.total_conversations += bump;
    demoState.series[demoState.series.length - 1].conversations += bump;
    demoState.languages[demoState.tick % demoState.languages.length].count += bump;
    demoState.health.process_uptime_seconds += 5;
    demoState.health.database.ping_ms = 9 + (demoState.tick % 7);
    demoState.overview.avg_latency_ms = 3020 + (demoState.tick % 5) * 45;
    if (demoState.tick % 4 === 0) demoState.overview.total_users++;
  }

  function demoFail(message) {
    var err = new Error(message);
    err.setupRequired = false;
    return err;
  }

  function demoRoute(method, path, body) {
    if (path === '/me') return DEMO_USER;

    if (path === '/health') return demoState.health;

    if (path === '/stats/overview') { demoDrift(); return demoState.overview; }

    if (path === '/stats/timeseries') return { days: 30, series: demoState.series };

    if (path === '/stats/languages') {
      var total = demoState.languages.reduce(function (s, l) { return s + l.count; }, 0);
      return {
        languages: demoState.languages.map(function (l) {
          return { language: l.language, count: l.count, pct: Math.round((l.count / total) * 1000) / 10 };
        })
      };
    }

    if (path === '/stats/latency') return demoState.latency;

    if (path === '/users') return { data: demoState.users, total: demoState.users.length };

    if (path.indexOf('/users/') === 0 && method === 'PATCH') {
      var id = path.slice('/users/'.length);
      var user = demoState.users.filter(function (u) { return u.id === id; })[0];
      if (!user) throw demoFail('User not found');
      user.conversation_count = 0;
      demoAudit('user.reset_free_tier', user.email, { conversation_count: 0 });
      return { data: user };
    }

    if (path === '/songs' && method === 'GET') return { data: demoState.songs, total: demoState.songs.length };

    if (path === '/songs' && method === 'POST') {
      if (!body.title) throw demoFail('Title is required');
      if (!body.audio_url) throw demoFail('Audio URL is required');
      demoState.songs.unshift({
        id: 's_' + (100 + demoState.songs.length),
        title: body.title,
        duration: body.duration || '0:00',
        image_url: body.image_url || '',
        audio_url: body.audio_url,
        created_at: new Date().toISOString()
      });
      demoAudit('song.create', body.title, { duration: body.duration || '0:00' });
      return { data: demoState.songs[0] };
    }

    if (path.indexOf('/songs/') === 0 && method === 'DELETE') {
      var songId = path.slice('/songs/'.length);
      var removed = demoState.songs.filter(function (s) { return s.id === songId; })[0];
      demoState.songs = demoState.songs.filter(function (s) { return s.id !== songId; });
      if (removed) demoAudit('song.delete', removed.title, { id: removed.id });
      return { ok: true };
    }

    if (path === '/conversations') return { data: demoState.conversations, total: demoState.overview.total_conversations };

    if (path === '/webhooks') return { data: demoState.webhooks, total: demoState.webhooks.length };

    if (path === '/flags' && method === 'GET') return { flags: demoState.flags };

    if (path === '/flags' && method === 'PATCH') {
      var flag = demoState.flags.filter(function (f) { return f.key === body.key; })[0];
      if (!flag) throw demoFail('Unknown flag');
      var before = flag.value;
      flag.value = body.value;
      demoAudit('flag.update', flag.key, { from: before, to: flag.value });
      return { flag: flag };
    }

    if (path === '/audit') return { data: demoState.audit, total: demoState.audit.length };

    throw demoFail('No demo data for ' + path);
  }

  function demoApi(path, options) {
    var method = (options.method || 'GET').toUpperCase();
    var base = path.split('?')[0];
    var body = options.body || {};
    // A short delay keeps the loading states visible instead of snapping.
    return new Promise(function (resolve, reject) {
      setTimeout(function () {
        try { resolve(demoRoute(method, base, body)); }
        catch (err) { reject(err); }
      }, 160);
    });
  }

  function enterDemo() {
    demo = true;
    demoState = buildDemoState();
    localStorage.setItem(DEMO_KEY, '1');
    document.body.classList.add('demo-on');
    $('demoBadge').classList.remove('hidden');
    showApp(DEMO_USER);
  }

  function exitDemo() {
    demo = false;
    demoState = null;
    localStorage.removeItem(DEMO_KEY);
    document.body.classList.remove('demo-on');
    $('demoBadge').classList.add('hidden');
    logout();
  }

  // -------------------------------------------------------------------- api
  function api(path, options) {
    options = options || {};
    if (demo) return demoApi(path, options);
    var headers = { 'Accept': 'application/json' };
    if (options.body) headers['Content-Type'] = 'application/json';
    if (token) headers['Authorization'] = 'Bearer ' + token;

    return fetch('/api/admin' + path, {
      method: options.method || 'GET',
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined
    }).then(function (res) {
      if (res.status === 401 || res.status === 404) {
        // 404 is what admin.middleware returns for a non-admin token.
        if (path !== '/login') { logout(); }
        throw new Error('Not authorised');
      }
      return res.json().then(function (data) {
        if (!res.ok) {
          var err = new Error(data.error || data.message || 'Request failed');
          // 503 + setup_required means the admin migration was never applied.
          // Carried through so the panel can explain it instead of showing
          // raw Postgres text.
          err.setupRequired = data.setup_required === true;
          err.hint = data.hint || '';
          throw err;
        }
        return data;
      });
    });
  }

  // ------------------------------------------------------------------ charts
  // Hand-rolled SVG: no CDN, no external library, so a flaky venue network
  // can never blank the dashboard mid-demo.

  function barChart(series, key, color) {
    if (!series || !series.length) return '<div class="empty">No data yet</div>';

    var W = 720, H = 190, padL = 34, padB = 26, padT = 10;
    var max = Math.max.apply(null, series.map(function (d) { return d[key]; }));
    if (max <= 0) max = 1;
    var innerW = W - padL - 10, innerH = H - padB - padT;
    var bw = innerW / series.length;

    var bars = series.map(function (d, i) {
      var h = (d[key] / max) * innerH;
      var x = padL + i * bw;
      var y = padT + innerH - h;
      return '<rect x="' + (x + bw * 0.15).toFixed(1) + '" y="' + y.toFixed(1) +
        '" width="' + (bw * 0.7).toFixed(1) + '" height="' + Math.max(h, d[key] > 0 ? 2 : 0).toFixed(1) +
        '" rx="2" fill="' + color + '"><title>' + d.date + ': ' + d[key] + '</title></rect>';
    }).join('');

    var ticks = [0, Math.round(max / 2), max].map(function (v) {
      var y = padT + innerH - (v / max) * innerH;
      return '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + W + '" y2="' + y.toFixed(1) +
        '" stroke="#332c26" stroke-width="1"/>' +
        '<text x="0" y="' + (y + 4).toFixed(1) + '" fill="#a1968a" font-size="10">' + v + '</text>';
    }).join('');

    var labels = series.map(function (d, i) {
      if (series.length > 12 && i % Math.ceil(series.length / 8) !== 0) return '';
      var x = padL + i * bw + bw / 2;
      return '<text x="' + x.toFixed(1) + '" y="' + (H - 8) +
        '" fill="#a1968a" font-size="10" text-anchor="middle">' + d.date.slice(5) + '</text>';
    }).join('');

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMidYMid meet">' +
      ticks + bars + labels + '</svg>';
  }

  function donut(items) {
    if (!items || !items.length) return '<div class="empty">No data yet</div>';

    var colors = ['#f0a04b', '#c9639b', '#4ec98a', '#5b9bd5', '#a1968a'];
    var total = items.reduce(function (sum, i) { return sum + i.count; }, 0);
    if (total === 0) return '<div class="empty">No data yet</div>';

    var cx = 90, cy = 90, r = 66, sw = 26;
    var circumference = 2 * Math.PI * r;
    var offset = 0;

    var arcs = items.map(function (item, idx) {
      var frac = item.count / total;
      var dash = frac * circumference;
      var seg = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' +
        colors[idx % colors.length] + '" stroke-width="' + sw +
        '" stroke-dasharray="' + dash.toFixed(2) + ' ' + (circumference - dash).toFixed(2) +
        '" stroke-dashoffset="' + (-offset).toFixed(2) +
        '" transform="rotate(-90 ' + cx + ' ' + cy + ')"><title>' +
        esc(item.language) + ': ' + item.count + '</title></circle>';
      offset += dash;
      return seg;
    }).join('');

    var legend = items.map(function (item, idx) {
      return '<span><i class="swatch" style="background:' + colors[idx % colors.length] + '"></i>' +
        esc(item.language.toUpperCase()) + ' — ' + fmt(item.count) + ' (' + item.pct + '%)</span>';
    }).join('');

    return '<svg viewBox="0 0 180 180" width="180" height="180" style="display:block;margin:0 auto">' +
      arcs +
      '<text x="90" y="86" text-anchor="middle" fill="#f2ece5" font-size="22" font-weight="600">' +
      fmt(total) + '</text>' +
      '<text x="90" y="104" text-anchor="middle" fill="#a1968a" font-size="10">TURNS</text>' +
      '</svg><div class="legend">' + legend + '</div>';
  }

  function latencyBars(data) {
    if (!data || !data.sample_size) return '<div class="empty">No conversations logged yet</div>';

    var stages = [
      { key: 'stt', label: 'Speech to text (Whisper)', color: '#5b9bd5' },
      { key: 'llm', label: 'AI response (GPT-4o)', color: '#f0a04b' },
      { key: 'tts', label: 'Text to speech (ElevenLabs)', color: '#c9639b' },
      { key: 'total', label: 'End to end', color: '#4ec98a' }
    ];

    var max = Math.max.apply(null, stages.map(function (s) {
      return (data[s.key] && data[s.key].p95) || 0;
    })) || 1;

    var rows = stages.map(function (s) {
      var stage = data[s.key] || {};
      var p50 = stage.p50 || 0, p95 = stage.p95 || 0;
      return '<tr>' +
        '<td style="width:220px">' + s.label + '</td>' +
        '<td style="min-width:220px">' +
          '<svg viewBox="0 0 300 22" width="100%" height="22" preserveAspectRatio="none">' +
            '<rect x="0" y="4" width="' + ((p95 / max) * 300).toFixed(1) + '" height="14" rx="3" fill="' + s.color + '" opacity="0.28"/>' +
            '<rect x="0" y="4" width="' + ((p50 / max) * 300).toFixed(1) + '" height="14" rx="3" fill="' + s.color + '"/>' +
          '</svg>' +
        '</td>' +
        '<td class="num">' + ms(stage.p50) + '</td>' +
        '<td class="num">' + ms(stage.p95) + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="table-wrap"><table>' +
      '<thead><tr><th>Stage</th><th></th><th class="num">p50</th><th class="num">p95</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' +
      '<div class="legend"><span class="muted">Sample: last ' + fmt(data.sample_size) +
      ' turns (' + fmt(data.voice_turns) + ' voice, ' + fmt(data.text_turns) +
      ' text). Solid bar = p50, faded = p95.</span></div>';
  }

  // ------------------------------------------------------------------- tabs
  function table(columns, rows, emptyMessage) {
    if (!rows || !rows.length) return '<div class="empty">' + emptyMessage + '</div>';
    var head = columns.map(function (c) {
      return '<th' + (c.num ? ' class="num"' : '') + '>' + c.label + '</th>';
    }).join('');
    var body = rows.map(function (r) {
      return '<tr>' + columns.map(function (c) {
        return '<td' + (c.num ? ' class="num"' : '') + (c.truncate ? ' class="truncate"' : '') + '>' +
          c.render(r) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    return '<div class="table-wrap"><table><thead><tr>' + head + '</tr></thead><tbody>' +
      body + '</tbody></table></div>';
  }

            esc(err.hint || 'Run supabase-admin-setup.sql in the Supabase SQL editor.') +

  // ------------------------------------------------------------------ poll
  function refresh() {
    return Promise.all([
      api('/stats/overview'),
      api('/stats/timeseries?days=30'),
      api('/stats/languages'),
      api('/stats/latency'),
      api('/health')
    ]).then(function (results) {
      latest = {
        overview: results[0], timeseries: results[1],
        languages: results[2], latency: results[3], health: results[4]
      };
      renderCards(latest.overview);
      $('timeseries').innerHTML = barChart(latest.timeseries.series, 'conversations', '#f0a04b');
      $('languages').innerHTML = donut(latest.languages.languages);
      $('latency').innerHTML = latencyBars(latest.latency);
      renderHealth(latest.health);
      $('liveDot').classList.remove('bad');
      $('liveLabel').textContent = 'Live';
    }).catch(function (err) {
      $('liveDot').classList.add('bad');
      $('liveLabel').textContent = err.message || 'Disconnected';
    });
  }

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(function () {
      refresh();
      renderTab();
    }, POLL_MS);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // ------------------------------------------------------------------ auth
  function showApp(user) {
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('whoami').textContent = user.email;
    $('demoBadge').classList.toggle('hidden', !demo);
    $('exitDemoBtn').classList.toggle('hidden', !demo);
    $('logoutBtn').classList.toggle('hidden', demo);
    refresh();
    renderTab();
    startPolling();
  }

  function logout() {
    stopPolling();
    token = null;
    localStorage.removeItem(TOKEN_KEY);
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
  }

  function login() {
    var email = $('email').value.trim();
    var password = $('password').value;
    $('loginError').textContent = '';

    fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || 'Login failed');
        return data;
      });
    }).then(function (data) {
      token = data.token;
      localStorage.setItem(TOKEN_KEY, token);
      showApp(data.user);
    }).catch(function (err) {
      $('loginError').textContent = err.message;
    });
  }

  // ------------------------------------------------------------------ events
  $('loginBtn').addEventListener('click', login);
  $('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  $('email').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  $('logoutBtn').addEventListener('click', logout);
  $('demoBtn').addEventListener('click', enterDemo);
  $('exitDemoBtn').addEventListener('click', exitDemo);
  $('refreshBtn').addEventListener('click', function () { refresh(); renderTab(); });

  $('tabs').addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.classList.remove('active');
    });
    tab.classList.add('active');
    activeTab = tab.dataset.tab;
    $('tabContent').innerHTML = '<div class="empty">Loading…</div>';
    renderTab();
  });

  $('tabContent').addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;

    if (action === 'reset-user') {
      api('/users/' + el.dataset.id, { method: 'PATCH', body: { conversation_count: 0 } })
        .then(function () { renderTab(); refresh(); })
        .catch(function (err) { alert(err.message); });
    }

    if (action === 'delete-song') {
      api('/songs/' + el.dataset.id, { method: 'DELETE' })
        .then(function () { renderTab(); })
        .catch(function (err) { alert(err.message); });
    }

    if (action === 'add-song') {
      var body = {
        title: $('songTitle').value.trim(),
        duration: $('songDuration').value.trim(),
        image_url: $('songImage').value.trim(),
        audio_url: $('songAudio').value.trim()
      };
      api('/songs', { method: 'POST', body: body })
        .then(function () { renderTab(); })
        .catch(function (err) { $('songError').textContent = err.message; });
    }
  });

  $('tabContent').addEventListener('change', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;

    if (el.dataset.action === 'set-flag') {
      api('/flags', { method: 'PATCH', body: { key: el.dataset.key, value: el.value === 'true' } })
        .catch(function (err) { alert(err.message); });
    }

    if (el.dataset.action === 'set-flag-number') {
      api('/flags', { method: 'PATCH', body: { key: el.dataset.key, value: Number(el.value) } })
        .catch(function (err) { alert(err.message); });
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopPolling(); } else if (token || demo) { refresh(); startPolling(); }
  });

  // ------------------------------------------------------------------ boot
  if (demo) {
    enterDemo();
  } else if (token) {
    api('/me')
      .then(function (user) { showApp(user); })
      .catch(function () { logout(); });
  }
})();
</script>
</body>
</html>
