# Cloud Build — CD pipeline for the Talk to Jesus backend.
#
# Trigger: push to `main` on github.com/manish-gitx/rn-final-manish
# Result:  test -> build image -> push to Artifact Registry -> update Cloud Run
#
# The image is tagged with $COMMIT_SHA, so every running revision traces back to
# an exact commit.
#
# NOTE: the existing trigger currently carries an equivalent build config INLINE
# and therefore ignores this file. Point it here to pick up the test gate:
#
#   gcloud builds triggers import --project=talktojesus-backend \
#     --source=<(gcloud builds triggers export --project=talktojesus-backend \
#       --trigger=rmgpgab-talktojesus-backend-us-central1-manish-gitx-rn-finaldva)
#
# or simply set "Cloud Build configuration file" to `cloudbuild.yaml` in the
# trigger's console UI. See README for the full instructions.

steps:
  # ------------------------------------------------------------------- build
  #
  # No test step here by design: deploys stay fast and cannot be blocked by a
  # flaky suite. Tests run in GitHub Actions (.github/workflows/ci.yml) on the
  # same push, so a red suite is visible without gating the deploy.
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - .
      - -f
      - Dockerfile

  # Guard against the admin console being silently dropped from the image. Its
  # failure mode is a 404 on /admin in production, which is easy to miss.
  - id: Verify
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        IMAGE=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
        docker run --rm --entrypoint sh "$$IMAGE" -c 'test -f /app/dist/index.js'
        docker run --rm --entrypoint sh "$$IMAGE" -c 'test -f /app/public/admin/index.html'
        echo "Image contents verified"

  # -------------------------------------------------------------------- push
  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

  # ------------------------------------------------------------------ deploy
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - --platform=managed
      - --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - --region=$_DEPLOY_REGION
      - --quiet

images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_PROJECT_ID: talktojesus-backend
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: us-central1
  _SERVICE_NAME: talktojesus-backend

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
